<style>
/* ========================================
   BASIC RESET
======================================== */

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

html{
 scroll-behavior:smooth;
 scroll-padding-top:100px;
}

body{
 font-family:"Segoe UI",Arial,sans-serif;
 background:#050816;
 color:#fff;
 overflow-x:hidden;
}

a{
 text-decoration:none;
 color:inherit;
}

button,
input{
 font:inherit;
}

button{
 -webkit-tap-highlight-color:transparent;
}

body::before{
 content:"";
 position:fixed;
 inset:0;
 z-index:-2;
 background:
  radial-gradient(circle at 12% 18%,rgba(0,229,255,.15),transparent 32%),
  radial-gradient(circle at 88% 28%,rgba(124,77,255,.18),transparent 32%),
  radial-gradient(circle at 50% 90%,rgba(0,255,170,.07),transparent 30%),
  #050816;
}

body::after{
 content:"";
 position:fixed;
 inset:0;
 z-index:-1;
 pointer-events:none;
 background-image:
  linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
 background-size:50px 50px;
 mask-image:linear-gradient(to bottom,black,transparent);
 -webkit-mask-image:linear-gradient(to bottom,black,transparent);
}


/* ========================================
   NAVIGATION
======================================== */

.navbar{
 position:fixed;
 top:15px;
 left:50%;
 transform:translateX(-50%);
 z-index:1000;

 width:min(1180px,94%);
 padding:12px 22px;

 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:20px;

 background:rgba(7,13,32,.82);
 border:1px solid rgba(255,255,255,.12);
 border-radius:50px;

 backdrop-filter:blur(22px);
 -webkit-backdrop-filter:blur(22px);

 box-shadow:0 12px 45px rgba(0,0,0,.35);

 animation:navDrop .7s ease;

 transition:
  top .4s ease,
  width .4s ease,
  padding .4s ease,
  gap .4s ease,
  transform .45s ease,
  opacity .35s ease,
  background .35s ease,
  border-radius .35s ease,
  box-shadow .35s ease;
}

/* Compact version after leaving top */

.navbar.nav-scrolled{
 top:7px;
 width:min(1050px,92%);
 padding:7px 18px;
 background:rgba(5,8,22,.95);
 border-radius:40px;
 box-shadow:0 8px 30px rgba(0,0,0,.4);
}

/* Hide navbar when scrolling down */

.navbar.nav-hidden{
 transform:translate(-50%,-140%);
 opacity:0;
 pointer-events:none;
}

.logo{
 display:flex;
 align-items:center;
 flex-shrink:0;
}

.logo img{
 width:155px;
 height:auto;
 display:block;

 transition:
  width .35s ease,
  transform .35s ease,
  filter .35s ease;
}

.logo img:hover{
 transform:scale(1.04);
 filter:drop-shadow(0 0 12px #00eaff);
}

.navbar.nav-scrolled .logo img{
 width:112px;
}

.nav-links{
 display:flex;
 align-items:center;
 gap:4px;
 list-style:none;
}

.nav-links a{
 display:block;
 padding:10px 13px;
 border-radius:30px;

 color:#cbd3e6;
 font-size:12px;
 font-weight:700;
 white-space:nowrap;

 transition:
  padding .35s ease,
  font-size .35s ease,
  color .25s ease,
  background .25s ease;
}

.nav-links a:hover,
.nav-links .active{
 color:#00eaff;
 background:rgba(0,229,255,.09);
}

.navbar.nav-scrolled .nav-links a{
 padding:7px 11px;
 font-size:11px;
}


/* ========================================
   HERO SECTION
======================================== */

.hero{

}

.orb{

.orb-one{

.orb-two{

}

.hero h1{

.hero h1 span{

}

.hero p{

.primary-btn{

}

}

.secondary-btn:hover{

}

}

.search-button:hover{

}
